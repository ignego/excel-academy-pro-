['Como registrar o que aprendeu?', 'Criar um exemplo prático no Excel','Somente mudar a cor da tela','Desinstalar o Excel','Renomear o navegador'],
['Qual é uma boa forma de organizar os dados?', 'Usar cabeçalhos claros e consistentes','Deixar colunas sem identificação','Misturar informações sem padrão','Apagar todas as linhas'],
['Por que testar com poucos dados primeiro?', 'Para verificar o resultado antes de ampliar','Para evitar salvar o arquivo','Para impedir cálculos','Para esconder erros'],
['Qual é a melhor maneira de consolidar a aula?', 'Repetir o procedimento e resolver exercícios','Pular todas as práticas','Fechar sem testar','Copiar respostas sem compreender']];return prompts.map((p,i)=>{let opts=p.slice(1);let offset=(l.id+i)%4;let rotated=[...opts.slice(offset),...opts.slice(0,offset)];return {id:`A${String(l.id).padStart(2,'0')}-Q${String(i+1).padStart(2,'0')}`,text:p[0],options:rotated,answer:rotated.indexOf(opts[0])}})}
function renderMenu(){const term=$('search').value.toLowerCase();$('menu').innerHTML=Array.from({length:9},(_,i)=>{let subset=lessons.filter(l=>l.module===i+1&&l.title.toLowerCase().includes(term));if(!subset.length)return '';return `<details ${i===lessons[selected].module-1?'open':''}><summary>Módulo ${i+1} — ${subset.length} aulas</summary>${subset.map(l=>`<button class="lesson ${l.id===lessons[selected].id?'active':''}" onclick="selectLesson(${l.id-1})">${state[l.id]?.complete?'✓ ':'▶ '}Aula ${String(l.number).padStart(2,'0')}: ${esc(l.title)}</button>`).join('')}</details>`}).join('')}
function updateDone(){$('done').textContent=Object.values(state).filter(x=>x.complete).length}
function selectLesson(index){selected=Math.max(0,Math.min(index,89));let l=lessons[selected];$('breadcrumb').textContent=`Módulo ${l.module} • Aula ${l.number} • ID ${String(l.id).padStart(2,'0')}`;$('title').textContent=l.title;$('player').src=l.video;$('explanation').textContent=l.script;$('quiz').innerHTML='';$('quizButton').textContent='Ver as 10 perguntas';renderMenu();updateDone();window.scrollTo({top:0,behavior:'smooth'})}
function showQuiz(){let l=lessons[selected],qs=questions(l);$('quiz').innerHTML=`<h3>Atividades da aula ${l.id}</h3><p class="muted">Responda às 10 perguntas. Você pode tentar novamente.</p>`+qs.map((q,i)=>`<div class="q" data-id="${q.id}"><b>${i+1}. ${esc(q.text)}</b><div class="muted small">ID: ${q.id}</div>${q.options.map((op,j)=>`<label><input type="radio" name="${q.id}" value="${j}"> ${esc(op)}</label>`).join('')}<div class="feedback"></div></div>`).join('')+`<button id="grade">Corrigir respostas</button><div id="result" class="panel" style="display:none"></div>`;$('grade').onclick=()=>{let score=0;qs.forEach(q=>{let card=document.querySelector(`[data-id="${q.id}"]`);let choice=card.querySelector('input:checked');let good=choice&&Number(choice.value)===q.answer;if(good)score++;card.querySelector('.feedback').innerHTML=choice?`<span class="${good?'good':'bad'}">${good?'✓ Correto':'✗ Incorreto. Resposta: '+esc(q.options[q.answer])}</span>`:'<span class="bad">Não respondida</span>'});state[l.id]={score,complete:score>=7};try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};$('result').style.display='block';$('result').innerHTML=`<b>Resultado: ${score}/10</b><p>${score>=7?'Aula concluída!':'Você precisa acertar pelo menos 7 para concluir. Revise e tente novamente.'}</p>`;renderMenu();updateDone()};$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
$('search').addEventListener('input',renderMenu);$('quizButton').onclick=showQuiz;$('nextButton').onclick=()=>selectLesson(selected+1);selectLesson(0);
</script></body></html>
